# 14.09: macos-15 → kalıcı self-hosted Mac ([self-hosted, macOS]).
# sudo xcode-select parola sorar ve asılır → DEVELOPER_DIR. brew koşulsuz install yok.
# checkout clean:true (önceki koşunun .xcodeproj sızmasın).
# concurrency cancel-in-progress:false. timeout-minutes: asılan iş kalıcı runner'ı kilitler.
name: Promo Capture (Simulator)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    name: Simulator tour recording
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Select Xcode 26
        run: |
          # 14.09: self-hosted'da `sudo xcode-select -s` parola sorar, iş sessizce asılır.
          # DEVELOPER_DIR aynı işi yapar ve sistemi hiç değiştirmez.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        working-directory: ios-native
        run: xcodegen generate

      - name: Boot simulator + grant permissions
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant location-always com.nickdegs.kisisel || true

      - name: Build for testing
        working-directory: ios-native
        run: |
          xcodebuild build-for-testing -project MoveLog.xcodeproj -scheme MoveLog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Record tour
        working-directory: ios-native
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo --codec h264 --force /tmp/promo_raw.mov &
          REC=$!
          sleep 2
          xcodebuild test-without-building -project MoveLog.xcodeproj -scheme MoveLog \
            -destination "id=$UDID" -only-testing:MoveLogUITests/PromoCaptureTest \
            -testLanguage tr -testRegion TR || true
          sleep 2
          kill -INT $REC
          sleep 5
          ls -la /tmp/promo_raw.mov

      - uses: actions/upload-artifact@v4
        with:
          name: promo-raw
          path: /tmp/promo_raw.mov
          retention-days: 3
