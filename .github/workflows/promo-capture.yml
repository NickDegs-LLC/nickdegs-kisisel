name: Promo Capture (Simulator)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    name: Simulator tour recording
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-native
        run: xcodegen generate

      - name: Boot simulator + grant permissions
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant location-always com.nickdegs.kisisel || true

      - name: Build for testing
        working-directory: ios-native
        run: |
          xcodebuild build-for-testing -project MoveLog.xcodeproj -scheme MoveLog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Record tour
        working-directory: ios-native
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo --codec h264 --force /tmp/promo_raw.mov &
          REC=$!
          sleep 2
          xcodebuild test-without-building -project MoveLog.xcodeproj -scheme MoveLog \
            -destination "id=$UDID" -only-testing:MoveLogUITests/PromoCaptureTest \
            -testLanguage tr -testRegion TR || true
          sleep 2
          kill -INT $REC
          sleep 5
          ls -la /tmp/promo_raw.mov

      - uses: actions/upload-artifact@v4
        with:
          name: promo-raw
          path: /tmp/promo_raw.mov
          retention-days: 3
