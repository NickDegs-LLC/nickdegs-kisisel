# 14.09: macos-15 → kalıcı self-hosted Mac ([self-hosted, macOS]).
# sudo xcode-select parola sorar ve asılır → DEVELOPER_DIR. brew koşulsuz install yok.
# checkout clean:true (önceki koşunun .xcodeproj/dd sızmasın).
# concurrency cancel-in-progress:false. timeout-minutes: asılan iş kalıcı runner'ı kilitler.
name: UI Review Shots

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shots:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Select Xcode 26
        run: |
          # 14.09: self-hosted'da `sudo xcode-select -s` parola sorar, iş sessizce asılır.
          # DEVELOPER_DIR aynı işi yapar ve sistemi hiç değiştirmez.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        working-directory: ios-native
        run: xcodegen generate
      - name: Build for Simulator
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoveLog.xcodeproj -scheme MoveLog \
            -sdk iphonesimulator -configuration Debug -derivedDataPath dd \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          # 05.09: `|| true` derleme hatasını GİZLİYORDU; sonraki adım boş bir .app'e
          # "Missing bundle ID" deyip alakasız bir hata veriyordu. Artık gerçek hata görünür.
          grep -q "BUILD SUCCEEDED" /tmp/build.log || { echo "::error::simülatör derlemesi BAŞARISIZ"; tail -40 /tmp/build.log; exit 1; }
          test -d "$(pwd)/dd/Build/Products/Debug-iphonesimulator/MoveLog.app"
          echo "APP=$(pwd)/dd/Build/Products/Debug-iphonesimulator/MoveLog.app" >> $GITHUB_ENV
      - name: Capture review screens
        working-directory: ios-native
        run: |
          set -e
          BUNDLE=com.nickdegs.kisisel
          OUT="$(pwd)/review"; mkdir -p "$OUT"
          UDID=$(xcrun simctl create "ui-review" "iPhone 16 Pro Max")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          for lang in tr en; do
            for scr in hero rides chat gps stats profile paywall avatar; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" DEMO "LANG=$lang" "SCREEN=$scr" >/dev/null
              sleep 5
              xcrun simctl io "$UDID" screenshot "$OUT/${lang}_${scr}.png" >/dev/null 2>&1 || echo "ss fail $lang $scr"
            done
          done
          # açık tema profil de (koyu/açık kontrol)
          echo "toplam: $(ls "$OUT" | wc -l)"
          xcrun simctl shutdown "$UDID" || true; xcrun simctl delete "$UDID" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: ios-native/review/*.png
          retention-days: 5
