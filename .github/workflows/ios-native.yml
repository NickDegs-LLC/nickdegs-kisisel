# 14.09: macos-15 → kalıcı self-hosted Mac ([self-hosted, macOS]).
# GitHub barındırmalı runner tek kullanımlıktır; Barış'ın makinesi değil — ağaç, keychain,
# Homebrew koşular arasında yaşar. sudo xcode-select parola sorar ve asılır → DEVELOPER_DIR.
# brew koşulsuz install/update yok. checkout clean:true (önceki .xcodeproj/Pods sızmasın).
# concurrency cancel-in-progress:false — yarıda kesilen imzalı koşu keychain'i temizlemeden ölür.
# timeout-minutes: asılan iş kalıcı runner'ı kilitler. keychain: rastgele parola, movelog-build,
# arama listesi ezilmez, always() temizlik. KEYCHAIN_PASSWORD kullanılmıyor (secret duruyor).
# pip --break-system-packages yok; TestFlight ataması Node JWT (ES256).
name: iOS Native → TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
    inputs:
      yukle:
        description: 'TestFlight yükle (false = imzasız duman derlemesi)'
        type: boolean
        default: true

# push'ta inputs.yukle boş gelir → yükleme ESKİ davranış gibi yapılır.
# yalnız workflow_dispatch + yukle=false imza/ASC/yüklemeyi atlar.
# kanıt: github.event_name != 'workflow_dispatch'  →  push'ta true (kısa devre, yükle)
#         || inputs.yukle                          →  dispatch+true yükle; dispatch+false atla

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SwiftUI & Upload
    runs-on: [self-hosted, macOS]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Select Xcode 27
        run: |
          # 14.09: self-hosted'da `sudo xcode-select -s` parola sorar, iş sessizce asılır.
          # DEVELOPER_DIR aynı işi yapar ve sistemi hiç değiştirmez.
          # 16.09: Xcode 27 (iOS 27 SDK) tercih edilir; yoksa en yüksek Xcode_*, yoksa Xcode.app.
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Import Distribution Certificate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          # 14.09: rastgele parola; KEYCHAIN_PASSWORD kullanılmıyor.
          # create-keychain öncesi eski movelog-build.keychain silinir.
          # list-keychains -s ezmez: eski liste saklanır, yenisi eklenir.
          # default-keychain -s YOK — login keychain'e dokunulmaz.
          KC_PASS=$(openssl rand -hex 20)
          echo "::add-mask::$KC_PASS"
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"
          security delete-keychain movelog-build.keychain 2>/dev/null || true
          security create-keychain -p "$KC_PASS" movelog-build.keychain
          security set-keychain-settings -lut 21600 movelog-build.keychain
          security unlock-keychain -p "$KC_PASS" movelog-build.keychain
          echo "$DIST_P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k movelog-build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" movelog-build.keychain
          security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//' > /tmp/movelog-kc-onceki.txt
          security list-keychains -d user -s movelog-build.keychain $(tr '\n' ' ' < /tmp/movelog-kc-onceki.txt)
          security find-identity -v -p codesigning movelog-build.keychain

      - name: Install Provisioning Profiles
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_WATCH_BASE64: ${{ secrets.PROVISIONING_PROFILE_WATCH_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nickdegs.mobileprovision
          echo "$PROVISIONING_PROFILE_WATCH_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nickdegs-watch.mobileprovision

      - name: Decode ASC API Key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # 2026-09-14: anahtar RUNNER_TEMP'e yazılır. Eskiden ~/.appstoreconnect/private_keys'e yazılıp temizlikte
          # siliniyordu; kalıcı runner Barış'ın Mac'i olduğu için oradaki TEK kopya yok oldu (.p8 yeniden indirilemez).
          mkdir -p "$RUNNER_TEMP/asc"
          ( umask 077; echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" )

      - name: Archive
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        timeout-minutes: 150
        working-directory: ios-native
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project MoveLog.xcodeproj \
            -scheme MoveLog \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MoveLog.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=SZF4T3P583 \
            OTHER_CODE_SIGN_FLAGS="--keychain movelog-build.keychain"

      - name: Export & Upload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nickdegs.kisisel</key><string>${PROFILE_NAME}</string>
              <key>com.nickdegs.kisisel.watchkitapp</key><string>NickDegs Watch AppStore</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MoveLog.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ Native build TestFlight'a yüklendi"

      - name: Auto-distribute to internal TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.yukle }}
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # 🔴 22.09: bu adim `node: command not found` (exit 127) ile dustu. Runner adiminin
          # kabugu /opt/homebrew/bin'i GORMUYOR (Xcode'un kendi alt sureci goruyor, o yaniltmasin).
          # `continue-on-error: true` oldugu icin kosu YESIL gorundu ama TestFlight ic dagitimi
          # HIC yapilmadi — yani "success" etiketi bu adim icin kanit DEGIL.
          # Ayni tuzak Mac'e SSH ile baglanirken de var (non-interactive kabuk).
          export PATH="/opt/homebrew/bin:$PATH"
          command -v node >/dev/null || { echo "🔴 node yok — ic dagitim atlandi"; exit 0; }
          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const https = require("https");
          const os = require("os");
          const path = require("path");

          const KID = process.env.ASC_KEY_ID;
          const ISS = process.env.ASC_ISSUER_ID;
          const APP = "6780779399";
          const GROUPS = [
            "8de9367e-e636-426d-a574-86fa0d69e7f5",
            "3f83e5d0-92f0-4917-be9d-9fb2ee53eb9a",
          ];
          const pem = fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, "asc", `AuthKey_${KID}.p8`),
            "utf8"
          );

          function b64url(d) {
            return Buffer.from(d).toString("base64url");
          }

          // ECDSA imza DER SEQUENCE { INTEGER r, INTEGER s } → ham r||s (32+32).
          function derToRawRS(der) {
            let i = 2;
            if ((der[1] & 0x80) !== 0) i += der[1] & 0x7f;
            function int32() {
              if (der[i++] !== 0x02) throw new Error("DER INTEGER beklenirdi");
              const len = der[i++];
              let v = der.subarray(i, i + len);
              i += len;
              while (v.length > 0 && v[0] === 0) v = v.subarray(1);
              if (v.length > 32) throw new Error("INTEGER 32 bayttan uzun");
              const out = Buffer.alloc(32);
              v.copy(out, 32 - v.length);
              return out;
            }
            return Buffer.concat([int32(), int32()]);
          }

          function jwt() {
            const now = Math.floor(Date.now() / 1000);
            const h = b64url(JSON.stringify({ alg: "ES256", kid: KID, typ: "JWT" }));
            const p = b64url(JSON.stringify({ iss: ISS, iat: now, exp: now + 1000, aud: "appstoreconnect-v1" }));
            const si = `${h}.${p}`;
            const sign = crypto.createSign("SHA256");
            sign.update(si);
            const der = sign.sign(pem);
            return `${si}.${b64url(derToRawRS(der))}`;
          }

          function api(method, pth, body) {
            return new Promise((resolve) => {
              const data = body ? JSON.stringify(body) : null;
              const headers = {
                Authorization: "Bearer " + jwt(),
                "Content-Type": "application/json",
              };
              if (data) headers["Content-Length"] = Buffer.byteLength(data);
              const req = https.request(
                { hostname: "api.appstoreconnect.apple.com", path: pth, method, headers },
                (res) => {
                  let buf = "";
                  res.on("data", (c) => { buf += c; });
                  res.on("end", () => {
                    try { resolve([res.statusCode, JSON.parse(buf || "{}")]); }
                    catch { resolve([res.statusCode, buf]); }
                  });
                }
              );
              req.on("error", (e) => resolve([0, String(e)]));
              if (data) req.write(data);
              req.end();
            });
          }

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          (async () => {
            const TARGET = (process.env.BUILD_NUMBER || "").trim();
            console.log("hedef build:", TARGET || "(latest)");
            let bid = null;
            for (let n = 0; n < 40; n++) {   // ~30 dk: build VALID olana kadar bekle
              let q = `/v1/builds?filter[app]=${APP}&limit=5&sort=-uploadedDate`;
              if (TARGET) q += `&filter[version]=${TARGET}`;   // TAM bu build'i hedefle (eski/yanlış atanmasın)
              const [, d] = await api("GET", q);
              if (d && typeof d === "object" && d.data && d.data.length) {
                const b = d.data[0];
                const st = b.attributes.processingState;
                console.log("build", b.attributes.version, st);
                if (st === "VALID") { bid = b.id; break; }
                if (st === "FAILED" || st === "INVALID") break;
              }
              await sleep(45000);
            }
            if (bid) {
              for (const g of GROUPS) {
                const [s] = await api("POST", `/v1/betaGroups/${g}/relationships/builds`, {
                  data: [{ type: "builds", id: bid }],
                });
                console.log("assign", g, s);
              }
              // DOĞRULA: internalBuildState IN_BETA_TESTING oldu mu; olmadıysa tekrar dene
              let ok = false;
              for (let n = 0; n < 6; n++) {
                await sleep(8000);
                const [, dd] = await api("GET", `/v1/builds/${bid}?include=buildBetaDetail`);
                const included = (dd && typeof dd === "object" && dd.included) || [];
                for (const inc of included) {
                  if (inc.type === "buildBetaDetails" && inc.attributes && inc.attributes.internalBuildState === "IN_BETA_TESTING") {
                    ok = true;
                  }
                }
                if (ok) break;
                for (const g of GROUPS) {
                  await api("POST", `/v1/betaGroups/${g}/relationships/builds`, {
                    data: [{ type: "builds", id: bid }],
                  });
                }
              }
              console.log(ok ? "✅ iç teste atandı (IN_BETA_TESTING)" : "⚠️ atandı, state doğrulanamadı");
            } else {
              console.log("build VALID olmadı, atama atlandı");
            }
          })();
          NODE

      - name: İmzasız simülatör derlemesi (duman)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.yukle }}
        working-directory: ios-native
        run: |
          xcodebuild build \
            -project MoveLog.xcodeproj \
            -scheme MoveLog \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Keychain ve sırları temizle
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -s /tmp/movelog-kc-onceki.txt ]; then
            security list-keychains -d user -s $(tr '\n' ' ' < /tmp/movelog-kc-onceki.txt)
          fi
          security delete-keychain movelog-build.keychain 2>/dev/null || true
          rm -f /tmp/movelog-kc-onceki.txt
          rm -f "$RUNNER_TEMP/dist.p12"
          rm -rf "$RUNNER_TEMP/asc"   # yalnız bu işin yazdığı kopya; ~/.appstoreconnect'e DOKUNMA
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/nickdegs.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/nickdegs-watch.mobileprovision"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/export"
          security list-keychains -d user
