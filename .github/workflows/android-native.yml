name: Android Native → Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.9.2 (targetSdk 36 için gerekli) EN AZ Gradle 8.11.1 ister — 8.9 ile
          # "Minimum supported Gradle version is 8.11.1" diye derleme düşüyor (05.09'da yaşandı).
          gradle-version: '8.11.1'

      - name: Versiyon (build number = epoch)
        run: echo "BUILD_NUMBER=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        run: echo "${{ secrets.MOVELOG_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/movelog.keystore"

      - name: Decode google-services.json (FCM push)
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > app/google-services.json

      - name: Build AAB (signed)
        env:
          MOVELOG_KEYSTORE: ${{ runner.temp }}/movelog.keystore
          MOVELOG_KS_PASS: ${{ secrets.MOVELOG_KS_PASS }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: movelog-native-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Google Play (production)
        uses: r0adkll/upload-google-play@v1
        # 05.09: `continue-on-error: true` KALDIRILDI. Play "Target SDK of artifact is too low"
        # diye REDDETTİĞİ hâlde adım "success" görünüyordu ve iş yeşil bitiyordu → yayınlandı
        # sanılıyordu ama Play'de hâlâ eski sürüm duruyordu (1.62 denemesinde bizzat yaşandı).
        # Yükleme başarısızsa koşu KIRMIZI olmalı.
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nickdegs.movelog
          releaseFiles: android-native/app/build/outputs/bundle/release/app-release.aab
          # OTO YAYIN (Baris 2026-09-05: "Google oto yayinla"). Onceden internal track'e
          # yuklenip production'a gecis ELLE yapiliyordu; artik main'e merge = Play'de yayin.
          track: production
          # TASLAK BIRAKMA (Baris 2026-08-03): 'draft' birakilinca paket Play Console'da
          # "degisiklikler incelemeye gonderilmedi" diye bekliyor ve karisiklik yaratiyordu.
          status: completed
          # r0adkll action'inda bu bayrak uygulamanin durumuna gore TERS calisir:
          #   uygulama YAYINDAYSA -> false SART (true verilirse Play hata dondurur)
          #   uygulama red/inceleme bekliyorsa -> true SART (yoksa yuklenen paket KAYBOLUR)
          # Move Log yayinda oldugu icin false. Redde duserse burayi true yap.
          changesNotSentForReview: false
