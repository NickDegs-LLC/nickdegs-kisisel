name: MoveLog
options:
  bundleIdPrefix: com.nickdegs
  developmentLanguage: en          # proje geliştirme dili = en (fallback asla tr olmasın)
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.0.0"
settings:
  base:
    MARKETING_VERSION: "1.66"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SZF4T3P583
    SWIFT_VERSION: "5.0"
targets:
  MoveLog:
    type: application
    platform: iOS
    sources:
      - path: Products.storekit
      - path: Sources
      - path: Resources
    # Info.plist DOSYASI (taban) + INFOPLIST_KEY_* (üstüne merge edilir).
    # fetch/processing: iOS Ayarlar'da "Arka Plan Uygulama Yenileme" satırını görünür kılar +
    # BGTaskScheduler ile periyodik uyanışta takip diriltilir ("asla durmasın" emniyeti).
    info:
      path: Info.plist
      properties:
        # ÇOK DİLLİLİK: app'in gerçekten desteklediği 12 dili iOS'a + App Store'a bildir.
        # Bunlar bildirilmezse iOS uygulamayı tek-dilli (geliştirme bölgesi) sanıp yabancı
        # kullanıcıyı yanlışlıkla o dile (Türkçe) düşürüyordu. Fallback dili = en.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr, de, fr, es, it, pt, ru, ja, zh, ko, ar]
        UIBackgroundModes: [location, fetch, processing, remote-notification, audio]
        BGTaskSchedulerPermittedIdentifiers: [com.nickdegs.kisisel.refresh]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.nickdegs.kisisel.invite
            CFBundleURLSchemes: [movelog]
        # "Tam Konum" kapalıysa geçici tam doğruluk isteği için (requestTemporaryFullAccuracyAuthorization)
        NSLocationTemporaryUsageDescriptionDictionary:
          TrackRide: "Rota kaydı için tam konum doğruluğu gerekir; kapalıyken rotan kilometrelerce hatalı görünür ve kaydedilemez."
        # v6: hareket işlemcisi (araç/bisiklet algılama) — takip ancak GERÇEKTEN araçtayken uyanır/uyur
        NSMotionUsageDescription: "Sürüşlerini otomatik algılamak için hareket verisi kullanılır: takip yalnızca araçta/bisikletteyken açılır, dururken pil ve gizlilik için kapanır."
    dependencies:
      - target: MoveLogWatch   # watch app iOS paketine gömülür (Watch/ dizinine)
      - package: LiveKit       # 1.9-C canlı interkom sesli oda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickdegs.kisisel
        TARGETED_DEVICE_FAMILY: "1"
        # Manuel imza hedef-BAZLI (CI'daki eski CLI global override watch profilini ezerdi)
        PROVISIONING_PROFILE_SPECIFIER: "NickDegs Kisisel AppStore"
        CODE_SIGN_ENTITLEMENTS: MoveLog.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Move Log"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Profil ve sohbet fotoğraflarını seçmek için."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Rota videolarını galerine kaydetmek için."
        INFOPLIST_KEY_NSCameraUsageDescription: "Fotoğraf çekip paylaşmak için."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Telsiz modu ve interkomda kulübünle konuşmak için."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Move Log; yürüyüş, bisiklet, motosiklet ve koşu rotalarını haritada kaydetmek, mesafe ve hızını hesaplamak ve izin verdiğin aile/arkadaşlarına canlı konumunu göstermek için konumunu kullanır. Örneğin bisiklet rotanı çizer ve eklediğin kişilerin nerede olduğunu görmesini sağlar."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Move Log, yalnızca bir gezi kaydı açıkken konumunu arka planda kullanır; böylece ekran kapalıyken bile tüm rotan kaydedilir ve otomatik rota videona dönüştürülür. Örneğin motosiklet sürüşünde uygulama arka plandayken rotan kaydedilerek rota filmin oluşturulur. Arka plan konumu yalnızca aktif kayıt ve senin açtığın canlı konum paylaşımı sırasında kullanılır."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # APPLE WATCH uygulaması: bilekten kayıt + canlı hız/mesafe/süre/NABIZ (HealthKit) + Traccar'a gönderim.
  # Tek-hedef modern watchOS app (WKApplication) — iOS app'e gömülür, bağımsız da çalışır.
  MoveLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nickdegs.kisisel
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: "Sürüş sırasında nabzını rota videona ve aktivite özetine eklemek için."
        NSHealthUpdateUsageDescription: "Antrenman oturumunu (sürüş kaydını) başlatmak için."
        NSLocationWhenInUseUsageDescription: "Bilekten başlattığın kayıtta rotanı çizmek için konum kullanılır."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickdegs.kisisel.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        PROVISIONING_PROFILE_SPECIFIER: "NickDegs Watch AppStore"
        CODE_SIGN_ENTITLEMENTS: Watch/MoveLogWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Move Log"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MoveLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: MoveLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickdegs.kisisel.uitests
        TEST_TARGET_NAME: MoveLog
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoveLog:
    build:
      targets:
        MoveLog: all
        MoveLogUITests: [test]
    test:
      targets:
        - MoveLogUITests
      storeKitConfiguration: Products.storekit
