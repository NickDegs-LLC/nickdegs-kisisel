name = "movelog-dispatch"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# routes: Faz 4'te eklenecek (nickdegs.com'a şimdilik trafik YOK)

[observability]
enabled = true

[vars]
ORTAM = "canli"
RUNPOD_ENDPOINT = "q9tw33kjmqx35a"
# 18.09: taktik (CPU) hattı kaldırıldı — RUNPOD_ENDPOINT_TAC ve presigned-PUT için gereken
# R2_ENDPOINT / R2_BUCKET çıkarıldı (tek okuyucuları taktik gönderimiydi). RunPod'daki
# movelog-tactical endpoint'i ve 3 worker kotası HÂLÂ DURUYOR — kapatma Barış'ın onayına bırakıldı.
[[d1_databases]]
binding = "DB"
database_name = "movelog-db"
database_id = "84d8e0a0-cc9b-45ec-b355-d1cc08a90dd9"

[[kv_namespaces]]
binding = "KV"
id = "fd5db982178f49c589858c525755fba7"

[[r2_buckets]]
binding = "R2"
bucket_name = "movelog"

[[queues.consumers]]
queue = "movelog-render"
max_batch_size = 1
max_retries = 3
# 01.09: ölü-mektup kuyruğu YOKTU → 3 denemede düşen iş KALICI olarak siliniyordu, izi kalmıyordu.
# Artık başarısız iş burada durur; gövdesi incelenebilir ve elle yeniden kuyruklanabilir.
dead_letter_queue = "movelog-render-olu"

[[queues.producers]]
binding = "RENDER_Q"
queue = "movelog-render"
